# docker-compose.yml — build all CTF Toolkit images with one command.
#
#   docker compose build            # build the 5 core images (friend's first-run)
#   docker compose build ctf-sage   # also build the heavy lazy-only SageMath image
#   docker compose build ctf-mobile # also build optional mobile/managed-code tools
#
# These services exist ONLY to build images (the toolkit runs containers ad-hoc via
# the Docker SDK, not via compose up). Image tags match docker_runner.TOOL_IMAGES.
#
# ctf-sage and ctf-mobile are under the "heavy" profile so a plain
# `docker compose build` does NOT pull their larger language/tooling stacks. Build
# them explicitly or let the server lazy-build them on first use.

services:
  ctf-tools:
    build:
      context: .
      dockerfile: docker/ctf-tools/Dockerfile
    image: ctftoolkit/ctf-tools

  ctf-pwn:
    build:
      context: .
      dockerfile: docker/ctf-pwn/Dockerfile
    image: ctftoolkit/ctf-pwn

  ctf-re:
    build:
      context: .
      dockerfile: docker/ctf-re/Dockerfile
    image: ctftoolkit/ctf-re

  ctf-crypto:
    build:
      context: .
      dockerfile: docker/ctf-crypto/Dockerfile
    image: ctftoolkit/ctf-crypto

  ctf-forensics:
    build:
      context: .
      dockerfile: docker/ctf-forensics/Dockerfile
    image: ctftoolkit/ctf-forensics

  ctf-sage:
    profiles: ["heavy"]
    build:
      context: .
      dockerfile: docker/ctf-sage/Dockerfile
    image: ctftoolkit/ctf-sage

  ctf-mobile:
    profiles: ["heavy"]
    build:
      context: .
      dockerfile: docker/ctf-mobile/Dockerfile
    image: ctftoolkit/ctf-mobile
