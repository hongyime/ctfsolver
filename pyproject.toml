[project]
name = "clank-the-flag"
version = "0.1.0"
description = "Dashboard harness for CTFd challenges solved by Claude Code or Codex in per-challenge containers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.1.0",
    "aiosqlite>=0.19.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.3.3",
    "cryptography>=48.0.1",
    "docker>=7.0.0",
    "duckduckgo-search>=4.0.0",
    "hypothesis>=6.0.0",
    "idna>=3.15",
    "lxml>=5.0.0",
    "mcp>=1.28.1",
    "pillow>=12.3.0",
    "playwright>=1.40.0",
    "psutil>=5.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-magic-bin>=0.4.14",
    "python-multipart>=0.0.31",
    "questionary>=2.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "shodan>=1.28.0",
    "soupsieve>=2.8.4",
    "starlette>=1.3.1",
    "streamlit>=1.59.2",
    "tiktoken>=0.5.0",
    "urllib3>=2.7.0",
    "xmltodict>=0.13.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "pip-audit>=2.9.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["toolkit_reference"]
