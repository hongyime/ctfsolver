name: Portable launcher contracts
on:
  push:
    paths:
      - '*.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/test_portable_launchers.py'
      - '.github/workflows/portable-launchers.yml'
  pull_request:
    paths:
      - '*.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/test_portable_launchers.py'
      - '.github/workflows/portable-launchers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launchers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_portable_launchers.py -v
