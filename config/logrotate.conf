# CTF Toolkit log rotation configuration
# Install: sudo cp config/logrotate.conf /etc/logrotate.d/ctftoolkit

/workspace/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    dateext
    dateformat -%Y%m%d
    postrotate
        # Optionally signal the application to reopen logs
        # kill -HUP `cat /var/run/ctftoolkit.pid 2>/dev/null` 2>/dev/null || true
    endscript
}
